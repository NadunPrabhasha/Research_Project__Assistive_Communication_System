<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistive Communication System</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:0;
    text-align:center;
}

.container{
    margin-top:80px;
    padding:30px;
}

h1{
    font-size:100px;
    margin-bottom:10px;
    color:#111827;
}

.subtitle{
    color:#555;
    margin-bottom:50px;
    max-width:800px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
    font-size:18px;
}

.mode-container{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.mode-card{
    background:white;
    padding:40px;
    border-radius:18px;
    width:380px;
    box-shadow:0 10px 24px rgba(0,0,0,0.12);
    text-decoration:none;
    color:black;
    transition:0.25s;
    border:1px solid #e5e7eb;
}

.mode-card:hover{
    transform:translateY(-8px) scale(1.02);
    box-shadow:0 14px 28px rgba(0,0,0,0.18);
}

.icon{
    font-size:100px;
    margin-bottom:15px;
}

.mode-title{
    font-size:42px;
    font-weight:bold;
    margin-bottom:8px;
}

.mode-desc{
    font-size:20px;
    color:#666;
    line-height:1.5;
}

.footer-note{
    margin-top:100px;
    color:#666;
    font-size:22px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>Assistive Communication System</h1>

    <p class="subtitle">
        ----------------------------------------------------------------------------------------------------------------------------
    </p>

    <div class="mode-container">

        <a href="/gesture" class="mode-card">
            <div class="icon">✋</div>
            <div class="mode-title">Gesture Mode</div>
            <!-- <div class="mode-desc">
                Real-time hand gesture recognition with voice output using computer vision.
            </div> -->
        </a>

        <a href="/symbols" class="mode-card">
            <div class="icon">🧩</div>
            <div class="mode-title">Symbol Mode</div>
            <!-- <div class="mode-desc">
                Click visual symbols to communicate common needs, emotions, and actions.
            </div> -->
        </a>

    </div>

    <p class="footer-note">
        Choose a mode to start communication assistance.
    </p>

</div>

</body>
</html>
