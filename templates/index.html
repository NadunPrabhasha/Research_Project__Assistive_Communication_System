<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistive Communication System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        #emoji {
            font-size: 80px;
            margin: 10px 0;
        }

        .confidence-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            height: 20px;
        }

        .confidence-bar {
            height: 100%;
            width: 0%;
            background: #3f8b65;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assistive Communication System</h1>
         <p class="subtitle">Live Gesture Prediction with Hand Detection and Speech Output</p> 

        <div class="video-box">
            <img src="{{ url_for('video_feed') }}" alt="Live Webcam Feed">
        </div>

        <div class="prediction-box">
            <h2>Prediction Result</h2>

            <div id="emoji">🤖</div>

            <p id="label">Waiting...</p>
            <p id="confidence">Confidence: 0%</p>

            <div class="confidence-wrapper">
                <div id="confidenceBar" class="confidence-bar"></div>
            </div>

            <p id="sentence">Waiting for gesture...</p>
            <p id="modelStatus" class="status-text">Checking model...</p>
            <p id="detectorStatus" class="status-text">Checking detector...</p>
        </div>
    </div>

    <script>
        const emojiMap = {
            happy: "😊",
            help: "🆘",
            food: "🍔",
            water: "💧",
            toilet: "🚻"
        };

        // let previousSentence = "";

        // function speak(text) {
        //     if (!('speechSynthesis' in window)) return;
        //     if (!text || text === "Waiting for gesture...") return;
        //     const utter = new SpeechSynthesisUtterance(text);
        //     utter.rate = 1;
        //     window.speechSynthesis.cancel();
        //     window.speechSynthesis.speak(utter);
        // }

        async function fetchPrediction() {
            try {
                const response = await fetch("/get_prediction");
                const data = await response.json();

                document.getElementById("label").innerText = data.label;
                document.getElementById("confidence").innerText = `Confidence: ${data.confidence}%`;
                document.getElementById("sentence").innerText = data.sentence;
                document.getElementById("modelStatus").innerText = data.model_status || "Model status unavailable";
                document.getElementById("detectorStatus").innerText = data.detector_status || "Detector status unavailable";

                document.getElementById("emoji").innerText = emojiMap[data.label] || "🤖";
                document.getElementById("confidenceBar").style.width = `${data.confidence}%`;

                // // Speak sentence on change
                // if (data.sentence && data.sentence !== previousSentence) {
                //     speak(data.sentence);
                //     previousSentence = data.sentence;
                // }
            } catch (error) {
                console.error("Error fetching prediction:", error);
            }
        }

        setInterval(fetchPrediction, 500);
    </script>
</body>
</html>
